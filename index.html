<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2C5F2E">
<title>Ons Dorpshuis</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--g:#2C5F2E;--g2:#3a7a3c;--gd:#C9922A;--bg:#f4f1eb;--sf:#fff;--sf2:#ede9e0;--tx:#1a1a1a;--tx2:#6b6560;--bd:#ddd6c8;--gr:#27AE60;--rd:#C0392B;--sh:0 2px 12px rgba(0,0,0,.09);--r:14px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;overflow-x:hidden}
button{font-family:'Nunito',sans-serif;cursor:pointer;border:none;outline:none}
input,select,textarea{font-family:'Nunito',sans-serif;outline:none}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.scr{flex:1;overflow-y:auto;padding-bottom:76px}
.scr::-webkit-scrollbar{display:none}

/* Nav */
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--g);display:flex;justify-content:space-around;padding:8px 0 max(8px,env(safe-area-inset-bottom));z-index:100}
.nb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 20px;color:rgba(255,255,255,.4);font-size:10px;font-weight:700;background:none;border:none;cursor:pointer;transition:.2s}
.nb.on{color:#fff}
.nb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dot{width:4px;height:4px;background:var(--gd);border-radius:50%;opacity:0;transition:.2s}
.nb.on .dot{opacity:1}

/* Header */
.hdr{background:var(--g);padding:50px 18px 22px;color:#fff}
.hdr h1{font-size:24px;font-weight:800;line-height:1.2}
.hdr p{font-size:12px;color:rgba(255,255,255,.6);margin-top:2px}
.hdr-logo{width:50px;height:50px;border-radius:10px;object-fit:cover;margin-bottom:8px;display:block;background:#fff}

/* Cards */
.card{background:var(--sf);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.slbl{font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--tx2);padding:14px 18px 6px}

/* Stats */
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 14px 0}
.sc{background:var(--sf);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px}
.sv{font-size:22px;font-weight:800;color:var(--g)}
.sl{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--tx2);margin-top:2px}

/* Invoice rows */
.ilist{margin:0 12px;background:var(--sf);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.irow{display:flex;align-items:center;padding:13px 15px;border-bottom:1px solid var(--bd);cursor:pointer;gap:11px;transition:.15s}
.irow:last-child{border-bottom:none}
.irow:active{background:var(--sf2)}
.iico{width:40px;height:40px;border-radius:10px;background:var(--g);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}
.inf{flex:1;min-width:0}
.inm{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imt{font-size:11px;color:var(--tx2);margin-top:2px}
.irt{text-align:right;flex-shrink:0}
.iam{font-weight:700;font-size:14px;color:var(--g)}

/* Badges */
.bdg{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:uppercase}
.paid{background:#d4f3e6;color:#1a7a4a}
.sent{background:#d0e8f7;color:#1a5e8a}
.draft{background:#eee;color:#777}
.overdue{background:#fde8e6;color:var(--rd)}

/* FAB */
.fab{position:fixed;bottom:82px;right:16px;width:52px;height:52px;border-radius:15px;background:var(--gd);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(201,146,42,.5);z-index:99;cursor:pointer;transition:.2s}
.fab:active{transform:scale(.9)}

/* Forms */
.fbody{padding:14px 14px 100px}
.fld{margin-bottom:12px}
.fld label{font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--tx2);display:block;margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;background:var(--sf2);border:1.5px solid transparent;border-radius:10px;padding:11px 13px;font-size:15px;color:var(--tx);transition:.2s}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--g);background:#fff}
.fld textarea{resize:none;height:70px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sh{font-weight:800;font-size:13px;color:var(--g);margin:14px 0 10px}

/* Items */
.ic{background:var(--sf2);border-radius:10px;padding:12px;margin-bottom:8px;position:relative}
.ig{display:grid;grid-template-columns:1fr 68px 86px;gap:8px;margin-top:8px}
.il{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--tx2);margin-bottom:4px}
.ii{width:100%;background:#fff;border:1.5px solid var(--bd);border-radius:8px;padding:9px 10px;font-size:14px;font-family:'Nunito',sans-serif}
.ii:focus{border-color:var(--g);outline:none}
.ia{background:var(--sf);border-radius:8px;padding:10px;font-size:13px;font-weight:700;color:var(--g);text-align:right}
.idel{position:absolute;top:8px;right:10px;background:none;border:none;color:var(--rd);font-size:20px;cursor:pointer}

/* Totals */
.tr{display:flex;justify-content:space-between;padding:5px 0;font-size:14px;color:var(--tx2)}
.tg{font-size:17px;font-weight:800;color:var(--g);border-top:2px solid var(--bd);padding-top:10px;margin-top:6px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:10px;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:700;transition:.15s;font-size:14px}
.bp{background:var(--g);color:#fff;padding:14px;width:100%;font-size:15px;border-radius:var(--r);font-weight:800}
.bp:active{background:var(--g2)}
.bo{background:transparent;border:2px solid var(--g);color:var(--g);padding:10px 14px}
.bsm{padding:8px 13px;font-size:12px;border-radius:8px}
.bgr{background:var(--gr);color:#fff}
.bwa{background:#25D366;color:#fff}
.bgd{background:var(--gd);color:#fff}
.brd{background:var(--rd);color:#fff}
.bfull{width:100%;margin-bottom:10px;padding:13px}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:flex-end;animation:fi .2s}
.sht{background:var(--sf);border-radius:22px 22px 0 0;width:100%;max-height:88vh;overflow-y:auto;padding:20px 18px 40px}
.hdl{width:40px;height:4px;background:var(--bd);border-radius:2px;margin:0 auto 16px}
.sht h2{font-size:20px;font-weight:800;margin-bottom:4px}
.sopt{display:flex;align-items:center;gap:14px;padding:14px;background:var(--sf2);border-radius:13px;cursor:pointer;margin-bottom:10px;border:2px solid transparent;transition:.15s}
.sopt:active{border-color:var(--g)}
.soi{font-size:28px;flex-shrink:0}
.sol{font-weight:700;font-size:15px}
.sos{font-size:12px;color:var(--tx2)}

/* Detail */
.dhdr{background:var(--g);padding:50px 18px 22px;color:#fff}
.hbx{background:rgba(255,255,255,.13);border-radius:14px;padding:16px;margin-top:14px}
.hamt{font-size:34px;font-weight:800}
.agrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.abtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0;border-radius:12px;font-weight:700;font-size:11px;cursor:pointer;border:none;font-family:'Nunito',sans-serif;transition:.15s}
.abtn:active{transform:scale(.94)}

/* Search */
.sw{padding:11px 14px;display:flex;align-items:center;gap:10px;background:var(--sf);border-radius:var(--r);box-shadow:var(--sh);margin:10px 12px}
.sw input{border:none;background:transparent;font-size:14px;width:100%}

/* Topbar */
.tb{background:var(--g);padding:46px 16px 14px;display:flex;align-items:center;gap:10px;color:#fff}
.tb h2{font-size:20px;font-weight:800}
.bk{background:none;border:none;color:#fff;cursor:pointer;padding:4px;display:flex}

/* Toast */
#toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--g);color:#fff;padding:10px 20px;border-radius:12px;font-size:13px;font-weight:700;box-shadow:0 4px 20px rgba(0,0,0,.2);z-index:999;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* Theme dots */
.td{width:40px;height:40px;border-radius:10px;cursor:pointer;border:3px solid transparent;transition:.15s;position:relative}
.td.sel{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--g)}

/* Logo block */
.lbk{display:flex;align-items:center;gap:14px;background:var(--sf);border-radius:var(--r);padding:14px;box-shadow:var(--sh);margin-bottom:14px}
.lth{width:54px;height:54px;border-radius:10px;object-fit:cover;background:#fff}

/* Empty */
.emp{padding:40px 20px;text-align:center;color:var(--tx2)}
.emp .bi{font-size:40px;margin-bottom:10px}

@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes su{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
.su{animation:su .2s ease forwards}
</style>
</head>
<body>
<div id="app">
  <div class="scr" id="scr"></div>
  <nav id="nav">
    <button class="nb" data-t="home" onclick="tab('home')">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
      Home<div class="dot"></div>
    </button>
    <button class="nb" data-t="inv" onclick="tab('inv')">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      Invoices<div class="dot"></div>
    </button>
    <button class="nb" data-t="set" onclick="tab('set')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93l-1.41 1.41M5.34 18.66l-1.41 1.41M4.93 4.93l1.41 1.41M18.66 18.66l1.41 1.41M2 12h2M20 12h2M12 2v2M12 20v2"/></svg>
      Settings<div class="dot"></div>
    </button>
  </nav>
</div>

const TH=[{n:'Forest',g:'#2C5F2E',a:'#C9922A'},{n:'Ocean',g:'#1B3A5C',a:'#E67E22'},{n:'Wine',g:'#5C1B2E',a:'#C0A060'},{n:'Slate',g:'#2D3748',a:'#DD6B20'}];
const S={tab:'home',modal:null,vid:null,q:''};
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch{return d;}};
const sv=(k,v)=>localStorage.setItem(k,JSON.stringify(v));

let INV=ld('od2_inv',[]);
let CFG=ld('od2_cfg',{name:'Ons Dorpshuis Beaufort Wes',addr:'Beaufort Wes, 6970',phone:'0740915178',email:'',bank:'',acc:'',branch:'',ti:0});
const svi=()=>sv('od2_inv',INV);
const svc=()=>sv('od2_cfg',CFG);
let CLIENTS=ld('od2_clients',[]);
const svcl=()=>sv('od2_clients',CLIENTS);

const ZAR=n=>'R '+Number(n||0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');
const fd=d=>d?new Date(d+'T12:00').toLocaleDateString('en-ZA',{day:'numeric',month:'short',year:'numeric'}):'';
const tod=()=>new Date().toISOString().split('T')[0];
const nid=()=>{const n=(INV.length?Math.max(...INV.map(i=>i.n||0)):0)+1;return{id:'INV-'+String(n).padStart(3,'0'),n};};
const nts=(a,b)=>a&&b?Math.max(1,Math.round((new Date(b)-new Date(a))/864e5)):0;
const tot=i=>i.items.reduce((a,x)=>a+(x.amt||0),0);
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function applyT(i){const t=TH[i||0];document.documentElement.style.setProperty('--g',t.g);document.documentElement.style.setProperty('--gd',t.a);}
applyT(CFG.ti);

let _tt;
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('on');clearTimeout(_tt);_tt=setTimeout(()=>e.classList.remove('on'),2800);}

function tab(t){
  S.tab=t;S.modal=null;
  document.querySelectorAll('.nb').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  const f=document.querySelector('.fab');
  if(f)f.style.display=(t==='home'||t==='inv')?'flex':'none';
  render();
}

function render(){
  const el=document.getElementById('scr');
  if(S.modal==='form'){rForm(el);return;}
  if(S.modal==='det'){rDet(el);return;}
  if(S.tab==='home'){rHome(el);return;}
  if(S.tab==='inv'){rInv(el);return;}
  if(S.tab==='set'){rSet(el);return;}
}

// HOME
function rHome(el){
  mkFAB();
  const paid=INV.filter(i=>i.st==='paid');
  const rev=paid.reduce((a,i)=>a+tot(i),0);
  const rec=[...INV].reverse().slice(0,5);
  el.innerHTML=`<div class="su">
    <div class="hdr">
      <img src="${LOGO}" class="hdr-logo">
      <h1>Ons Dorpshuis</h1>
      <p>Beaufort Wes &middot; Invoices</p>
    </div>
    <div class="sgrid">
      <div class="sc"><div class="sv">${INV.length}</div><div class="sl">Total</div></div>
      <div class="sc"><div class="sv" style="color:var(--gr)">${paid.length}</div><div class="sl">Paid</div></div>
      <div class="sc"><div class="sv" style="color:#e67e22">${INV.filter(i=>i.st!=='paid').length}</div><div class="sl">Pending</div></div>
      <div class="sc"><div class="sv" style="font-size:15px">${ZAR(rev)}</div><div class="sl">Revenue</div></div>
    </div>
    <div class="slbl">Recent</div>
    <div class="ilist">${rec.length?rec.map(iRow).join(''):'<div class="emp"><div class="bi">🧾</div><p>No invoices yet.<br>Tap + to create one.</p></div>'}</div>
    <div style="height:20px"></div>
  </div>`;
}

// INVOICES
function rInv(el){
  mkFAB();
  const q=S.q.toLowerCase();
  const fl=q?INV.filter(i=>(i.guest||'').toLowerCase().includes(q)||(i.id||'').toLowerCase().includes(q)):INV;
  const gr={paid:[],sent:[],draft:[]};
  [...fl].reverse().forEach(i=>(gr[i.st]||gr.draft).push(i));
  let h=`<div class="su">
    <div class="hdr"><h1>Invoices</h1><p>${INV.length} total</p></div>
    <div class="sw">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--tx2)" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input value="${esc(S.q)}" oninput="S.q=this.value;render()" placeholder="Search guest or invoice...">
    </div>`;
  [['paid','Paid'],['sent','Sent'],['draft','Draft / Overdue']].forEach(([k,l])=>{
    if(!gr[k].length)return;
    h+=`<div class="slbl">${l} (${gr[k].length})</div><div class="ilist">${gr[k].map(iRow).join('')}</div>`;
  });
  if(!fl.length)h+='<div class="emp"><div class="bi">🔍</div><p>No results.</p></div>';
  h+='<div style="height:20px"></div></div>';
  el.innerHTML=h;
}

function iRow(i){
  const t=tot(i);
  const od=i.st!=='paid'&&i.due&&new Date(i.due)<new Date();
  const b=od?'overdue':i.st;
  return `<div class="irow" onclick="openDet('${i.id}')">
    <div class="iico">🏡</div>
    <div class="inf"><div class="inm">${esc(i.guest)}</div><div class="imt">${esc(i.id)} &middot; ${fd(i.date)}</div></div>
    <div class="irt"><div class="iam">${ZAR(t)}</div><span class="bdg ${b}">${od?'overdue':i.st}</span></div>
  </div>`;
}

// DETAIL
function openDet(id){S.vid=id;S.modal='det';const f=document.querySelector('.fab');if(f)f.style.display='none';render();}

function rDet(el){
  const inv=INV.find(i=>i.id===S.vid);if(!inv){closeM();return;}
  const t=tot(inv);
  const od=inv.st!=='paid'&&inv.due&&new Date(inv.due)<new Date();
  const b=od?'overdue':inv.st;
  const n=inv.ci&&inv.co?nts(inv.ci,inv.co):0;
  el.innerHTML=`<div class="su">
    <div class="dhdr">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
        <button class="bk" onclick="closeM()"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg></button>
        <div style="flex:1"><div style="font-size:20px;font-weight:800">${esc(inv.id)}</div><div style="font-size:11px;opacity:.6">${fd(inv.date)}</div></div>
        <span class="bdg ${b}">${od?'overdue':inv.st}</span>
      </div>
      <div class="hbx">
        <div style="font-size:11px;opacity:.7;margin-bottom:4px">Total Amount</div>
        <div class="hamt">${ZAR(t)}</div>
        <div style="font-size:13px;opacity:.85;margin-top:8px">👤 ${esc(inv.guest)}</div>
        <div style="font-size:11px;opacity:.6">${fd(inv.ci)} → ${fd(inv.co)}${n?' · '+n+' night'+(n!==1?'s':''):''}</div>
      </div>
    </div>
    <div style="padding:14px">
      <div class="agrid">
        <button class="abtn bo" onclick="openEdit('${inv.id}')">✏️<span>Edit</span></button>
        <button class="abtn bwa" onclick="showSend('${inv.id}')">📤<span>Send PDF</span></button>
        <button class="abtn bgd" onclick="dlPDF('${inv.id}')">⬇️<span>Save PDF</span></button>
      </div>
      <div class="card" style="margin-bottom:12px">
        <div style="font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--tx2);margin-bottom:8px">Guest</div>
        <div style="font-weight:700;font-size:15px">${esc(inv.guest)}</div>
        ${inv.email?`<div style="font-size:13px;color:var(--tx2);margin-top:3px">✉️ ${esc(inv.email)}</div>`:''}
        ${inv.phone?`<div style="font-size:13px;color:var(--tx2);margin-top:2px">📱 ${esc(inv.phone)}</div>`:''}
      </div>
      <div class="card" style="margin-bottom:12px">
        <div style="font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--tx2);margin-bottom:8px">Services</div>
        ${inv.items.map((x,i)=>`<div style="display:flex;justify-content:space-between;padding:8px 0;${i<inv.items.length-1?'border-bottom:1px solid var(--bd)':''}">
          <div><div style="font-size:14px;font-weight:600">${esc(x.desc)}</div><div style="font-size:11px;color:var(--tx2)">× ${x.qty} @ ${ZAR(x.rate)}</div></div>
          <div style="font-weight:700">${ZAR(x.amt)}</div></div>`).join('')}
        <div style="border-top:2px solid var(--bd);margin-top:10px;padding-top:10px;display:flex;justify-content:space-between;font-size:16px;font-weight:800;color:var(--g)">
          <span>Total</span><span>${ZAR(t)}</span>
        </div>
      </div>
      ${CFG.bank?`<div class="card" style="margin-bottom:12px;background:var(--sf2)">
        <div style="font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--tx2);margin-bottom:6px">Banking</div>
        <div style="font-size:13px;line-height:1.8">🏦 ${esc(CFG.bank)}<br>Acc: ${esc(CFG.acc)} · Branch: ${esc(CFG.branch)}</div>
      </div>`:''}
      ${inv.notes?`<div class="card" style="margin-bottom:12px;font-style:italic;font-size:13px;color:var(--tx2)">"${esc(inv.notes)}"</div>`:''}
      ${inv.st!=='paid'?`<button class="btn bgr bfull" onclick="mkPaid('${inv.id}')">✓ Mark as Paid</button>`:''}
      <div id="da"><button class="btn bfull" style="background:transparent;border:2px solid var(--rd);color:var(--rd)" onclick="confDel('${inv.id}')">Delete Invoice</button></div>
    </div>
    <div style="height:20px"></div>
  </div>`;
}

function confDel(id){document.getElementById('da').innerHTML=`<div style="display:flex;gap:10px"><button class="btn brd" style="flex:1;padding:13px" onclick="delInv('${id}')">Confirm Delete</button><button class="btn bo" style="flex:1;padding:13px" onclick="render()">Cancel</button></div>`;}
function mkPaid(id){const i=INV.find(x=>x.id===id);if(!i)return;i.st='paid';svi();render();toast('Marked as paid ✓');}
function delInv(id){INV=INV.filter(i=>i.id!==id);svi();closeM();toast('Invoice deleted');}
function closeM(){S.modal=null;const f=document.querySelector('.fab');if(f)f.style.display='flex';render();}

// CLIENT MANAGEMENT
function selectClient(idx){
  if(idx==='')return;
  const c=CLIENTS[parseInt(idx)];
  if(!c)return;
  ED.guest=c.name;ED.email=c.email||'';ED.phone=c.phone||'';
  rForm(document.getElementById('scr'));
}
function upsertClient(name,email,phone){
  if(!(name||'').trim())return;
  const i=CLIENTS.findIndex(c=>c.name.toLowerCase()===name.toLowerCase());
  const d={name:name.trim(),email:email||'',phone:phone||''};
  if(i>=0)CLIENTS[i]=d;else{CLIENTS.push(d);CLIENTS.sort((a,b)=>a.name.localeCompare(b.name));}
  svcl();
}
function deleteClientByName(name){
  CLIENTS=CLIENTS.filter(c=>c.name.toLowerCase()!==name.toLowerCase());
  svcl();
}

function cancelForm(){S.modal=S.vid?'det':null;const f=document.querySelector('.fab');if(f)f.style.display=S.modal?'none':'flex';render();}
function addI(){ED.items.push({desc:'',qty:1,rate:0,amt:0});}
function rmI(i){ED.items.splice(i,1);}
function autoN(){
  if(!ED.ci||!ED.co)return;
  const n=nts(ED.ci,ED.co);
  if(n>0&&ED.items[0]){const f=ED.items[0];if(/night|room|suite|kamer|verblyf|accomm/i.test(f.desc)){f.qty=n;f.amt=n*(f.rate||0);}}
}
function rTot(){
  const s=ED.items.reduce((a,i)=>a+(i.amt||0),0);
  ED.items.forEach((x,i)=>{const e=document.getElementById('ia'+i);if(e)e.textContent=ZAR(x.amt);});
  const sd=document.getElementById('sd');if(sd)sd.textContent=ZAR(s);
  const td=document.getElementById('td');if(td)td.textContent=ZAR(s);
}
function saveInv(){
  if(!(ED.guest||'').trim()){toast('⚠️ Enter guest name');return;}
  const i=INV.findIndex(x=>x.id===ED.id);
  if(i>=0)INV[i]=ED;else INV.push(ED);
  svi();
  upsertClient(ED.guest,ED.email,ED.phone);
  S.vid=ED.id;S.modal='det';ED=null;render();toast('Invoice saved ✓');
}

// PDF
async function buildPDF(id){
  const inv=INV.find(i=>i.id===id);if(!inv)return null;
  const t=tot(inv);
  const th=TH[CFG.ti||0];
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'a4'});
  const W=210,L=18,R=18,TW=W-L-R;
  const hx=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const gc=hx(th.g);

  // Logo
  try{doc.addImage(LOGO,'JPEG',L,10,30,30,'','FAST');}catch(e){}

  // Business info
  doc.setFontSize(9);doc.setTextColor(100,100,100);doc.setFont('helvetica','normal');
  doc.text(CFG.name,L+33,17);
  doc.text(CFG.addr||'',L+33,22);
  doc.text(CFG.phone||'',L+33,27);
  if(CFG.email)doc.text(CFG.email,L+33,32);

  // Title
  doc.setFont('helvetica','bold');doc.setFontSize(30);doc.setTextColor(...gc);
  doc.text('INVOICE',W-R,20,{align:'right'});

  // Meta
  let my=28;
  [[' # ',inv.id],['Date',fd(inv.date)],...(inv.due?[['Due',fd(inv.due)]]:[])].forEach(([l,v],i)=>{
    doc.setFontSize(8.5);doc.setFont('helvetica','normal');doc.setTextColor(140,140,140);doc.text(l,W-R-44,my+i*5);
    doc.setFont('helvetica','bold');doc.setTextColor(20,20,20);doc.text(v||'',W-R,my+i*5,{align:'right'});
  });

  // Divider
  const dy=46;doc.setDrawColor(...gc);doc.setLineWidth(0.8);doc.line(L,dy,W-R,dy);

  // Billed to
  let y=dy+8;
  doc.setFontSize(7);doc.setFont('helvetica','bold');doc.setTextColor(160,160,160);doc.text('BILLED TO',L,y);
  y+=5;doc.setFontSize(11);doc.setFont('helvetica','bold');doc.setTextColor(20,20,20);doc.text(inv.guest||'',L,y);
  y+=5;doc.setFontSize(9);doc.setFont('helvetica','normal');doc.setTextColor(100,100,100);
  if(inv.email){doc.text(inv.email,L,y);y+=4.5;}
  if(inv.phone){doc.text(inv.phone,L,y);y+=4.5;}

  // Status watermark
  doc.setFontSize(20);doc.setFont('helvetica','bold');
  const wc=inv.st==='paid'?[39,174,96]:[192,57,43];
  doc.setTextColor(...wc);doc.setGState(new doc.GState({opacity:0.12}));
  doc.text(inv.st.toUpperCase(),W-R-5,dy+20,{align:'right',angle:15});
  doc.setGState(new doc.GState({opacity:1}));

  // Table header
  y=dy+36;
  doc.setFillColor(...gc);doc.rect(L,y-4,TW,7,'F');
  doc.setFontSize(7.5);doc.setFont('helvetica','bold');doc.setTextColor(255,255,255);
  doc.text('DESCRIPTION',L+2,y);
  doc.text('QTY',L+TW*0.60,y,{align:'right'});
  doc.text('RATE',L+TW*0.78,y,{align:'right'});
  doc.text('AMOUNT',L+TW,y,{align:'right'});
  y+=8;

  // Items
  inv.items.forEach((x,i)=>{
    if(i%2===1){doc.setFillColor(246,246,246);doc.rect(L,y-3.5,TW,7,'F');}
    doc.setFontSize(9);doc.setTextColor(25,25,25);doc.setFont('helvetica','normal');
    const desc=x.desc||'';
    doc.text(desc.length>45?desc.slice(0,44)+'…':desc,L+2,y);
    doc.text(String(x.qty),L+TW*0.60,y,{align:'right'});
    doc.text(ZAR(x.rate),L+TW*0.78,y,{align:'right'});
    doc.setFont('helvetica','bold');doc.text(ZAR(x.amt),L+TW,y,{align:'right'});
    y+=8;
  });

  // Total
  y+=4;doc.setDrawColor(...gc);doc.setLineWidth(0.5);doc.line(L+TW*0.55,y,L+TW,y);
  y+=6;doc.setFontSize(14);doc.setFont('helvetica','bold');doc.setTextColor(...gc);
  doc.text('TOTAL DUE',L+TW*0.56,y);
  doc.text(ZAR(t),L+TW,y,{align:'right'});

  // Notes
  if(inv.notes){y+=10;doc.setFontSize(8.5);doc.setFont('helvetica','italic');doc.setTextColor(120,120,120);doc.text('"'+inv.notes+'"',L,y,{maxWidth:TW});}

  // Banking
  if(CFG.bank){
    y+=14;doc.setFillColor(247,247,247);doc.rect(L,y,TW,16,'F');
    doc.setDrawColor(...gc);doc.setLineWidth(1);doc.line(L,y,L,y+16);
    y+=5;doc.setFontSize(7);doc.setFont('helvetica','bold');doc.setTextColor(150,150,150);doc.text('BANKING DETAILS',L+3,y);
    y+=5;doc.setFontSize(9);doc.setFont('helvetica','normal');doc.setTextColor(40,40,40);
    doc.text(CFG.bank+' · Account: '+CFG.acc+' · Branch: '+CFG.branch,L+3,y);
  }

  // Footer
  doc.setFontSize(8);doc.setFont('helvetica','normal');doc.setTextColor(180,180,180);
  doc.text('Thank you for choosing '+CFG.name,W/2,284,{align:'center'});

  return doc;
}

    toast('PDF saved ✓');
  }catch(e){console.error(e);toast('PDF error – check console');}
}

// Helper: build PDF blob + file object
async function _makePDFFile(id){
  const inv=INV.find(i=>i.id===id);if(!inv)return null;
  const doc=await buildPDF(id);if(!doc)return null;
  const blob=doc.output('blob');
  const fname='Invoice-'+inv.id+'-'+(inv.guest||'Guest').replace(/\s+/g,'-')+'.pdf';
  return{file:new File([blob],fname,{type:'application/pdf'}),blob,fname,inv};
}

// Helper: trigger download
function _dlBlob({blob,fname}){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=fname;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),6000);
}

// 1. Native Android share sheet — lets user pick WhatsApp, Gmail, Drive etc
async function sharePDF(id){
  document.getElementById('sm')?.remove();
  toast('⏳ Generating PDF...');
  try{
    const r=await _makePDFFile(id);if(!r)return;
    const{file,inv}=r;
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({
        files:[file],
        title:'Invoice '+inv.id+' – Ons Dorpshuis',
        text:'Invoice for '+(inv.guest||'')+'. Amount due: '+ZAR(tot(inv))
      });
      toast('Shared ✓');
    }else{
      _dlBlob(r);
      toast('PDF saved – attach manually to send');
    }
  }catch(e){if(e.name!=='AbortError'){console.error(e);toast('Error: '+e.message);}}
}

// 2. WhatsApp: native share (attaches PDF), fallback to wa.me + pre-filled message
async function sendViaWA(id){
  document.getElementById('sm')?.remove();
  toast('⏳ Generating PDF...');
  try{
    const r=await _makePDFFile(id);if(!r)return;
    const{file,inv}=r;
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{
        await navigator.share({files:[file],title:'Invoice '+inv.id,text:'Invoice for '+(inv.guest||'')+'. Amount: '+ZAR(tot(inv))});
        toast('Shared ✓');return;
      }catch(se){if(se.name==='AbortError')return;}
    }
    // Fallback: save PDF then open WhatsApp with pre-filled message
    _dlBlob(r);
    const ph=(inv.phone||'').replace(/\D/g,'').replace(/^0/,'');
    const msg=encodeURIComponent('Hi '+inv.guest+', please find the attached Invoice '+inv.id+' from Ons Dorpshuis.\nAmount due: '+ZAR(tot(inv))+'\nKind regards, Ons Dorpshuis');
    setTimeout(()=>{window.location.href=ph?'https://wa.me/27'+ph+'?text='+msg:'https://wa.me/?text='+msg;},1800);
    toast('PDF saved – attach in WhatsApp');
  }catch(e){console.error(e);toast('Error: '+e.message);}
}

// 3. Email: native share (attaches PDF), fallback to mailto + pre-filled subject/body
async function sendViaEmail(id){
  document.getElementById('sm')?.remove();
  toast('⏳ Generating PDF...');
  try{
    const r=await _makePDFFile(id);if(!r)return;
    const{file,inv}=r;
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{
        await navigator.share({files:[file],title:'Invoice '+inv.id,text:'Invoice for '+(inv.guest||'')+'. Amount: '+ZAR(tot(inv))});
        toast('Shared ✓');return;
      }catch(se){if(se.name==='AbortError')return;}
    }
    // Fallback: save PDF then open mailto with pre-filled content
    _dlBlob(r);
    const sub=encodeURIComponent('Invoice '+inv.id+' – Ons Dorpshuis');
    const body=encodeURIComponent('Dear '+(inv.guest||'Guest')+',\n\nPlease find attached Invoice '+inv.id+'.\nAmount due: '+ZAR(tot(inv))+'\n\nKind regards\nOns Dorpshuis\n'+(CFG.phone||''));
    setTimeout(()=>{window.location.href='mailto:'+(inv.email||'')+'?subject='+sub+'&body='+body;},1800);
    toast('PDF saved – attach in your email app');
  }catch(e){console.error(e);toast('Error: '+e.message);}
}
